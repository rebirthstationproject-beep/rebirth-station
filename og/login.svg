<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A237E"/>
      <stop offset="1" stop-color="#0D1340"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Google OAuth card (center-right) -->
  <g transform="translate(720, 200)" font-family="'Pretendard',sans-serif">
    <rect x="0" y="0" width="380" height="200" rx="16" fill="#fff"/>
    <g transform="translate(40, 70)">
      <svg width="24" height="24" viewBox="0 0 18 18" x="0" y="0">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      <text x="40" y="18" fill="#3c4043" font-size="18" font-weight="600">Google로 계속하기</text>
    </g>
    <text x="40" y="148" fill="#5f6368" font-size="13">한 Gmail로 모든 ver. 자동 연동</text>
  </g>

  <!-- ver linkage diagram (below the card) -->
  <g transform="translate(720, 430)" font-family="'Pretendard',sans-serif" font-size="13">
    <g><rect x="0"   y="0" width="115" height="36" rx="18" fill="#1A237E" stroke="#fff" stroke-opacity="0.3"/>
       <text x="57" y="23" fill="#fff" text-anchor="middle">Rebirth</text></g>
    <g><rect x="130" y="0" width="115" height="36" rx="18" fill="#E91E63" opacity="0.92"/>
       <text x="187" y="23" fill="#fff" text-anchor="middle">ver. 주소모아</text></g>
    <g><rect x="260" y="0" width="115" height="36" rx="18" fill="#0AB39C" opacity="0.92"/>
       <text x="317" y="23" fill="#fff" text-anchor="middle">ver. 케이링크</text></g>
  </g>

  <!-- brand text -->
  <g transform="translate(80, 200)" fill="#fff" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <text x="0" y="0" font-size="18" font-weight="500" letter-spacing="4" opacity="0.7">ACCOUNT</text>
    <text x="0" y="76" font-size="58" font-weight="800" letter-spacing="-1.5">Google 계정으로</text>
    <text x="0" y="142" font-size="58" font-weight="800" letter-spacing="-1.5">시작하기</text>
    <text x="0" y="208" font-size="20" font-weight="400" opacity="0.78">하나의 Gmail = 모든 ver. 자동 entitlement</text>
  </g>

  <g transform="translate(80, 560)" fill="#fff" opacity="0.65" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" font-size="16" letter-spacing="2">rebirthstation.com/login</text>
  </g>
</svg>
