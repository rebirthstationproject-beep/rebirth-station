<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A237E"/><stop offset="1" stop-color="#0D1340"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- conversion flow (right) -->
  <g transform="translate(700, 240)" font-family="'JetBrains Mono', monospace">
    <g><rect x="0" y="0" width="180" height="80" rx="12" fill="#fff" opacity="0.12"/>
       <text x="90" y="35" text-anchor="middle" fill="#fff" font-size="14" opacity="0.6">FROM</text>
       <text x="90" y="60" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">.streamDeck</text>
    </g>
    <g transform="translate(190, 30)">
       <text x="0" y="0" fill="#E91E63" font-size="32">→</text>
    </g>
    <g transform="translate(230, 0)"><rect x="0" y="0" width="180" height="80" rx="12" fill="#E91E63" opacity="0.92"/>
       <text x="90" y="35" text-anchor="middle" fill="#fff" font-size="14" opacity="0.85">TO</text>
       <text x="90" y="60" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">.cubelist</text>
    </g>
  </g>

  <g transform="translate(80, 200)" fill="#fff" font-family="'Pretendard',sans-serif">
    <text x="0" y="0" font-size="18" font-weight="500" letter-spacing="4" opacity="0.7">CONVERT</text>
    <text x="0" y="76" font-size="60" font-weight="800" letter-spacing="-1.5">파일 변환</text>
    <text x="0" y="142" font-size="60" font-weight="800" letter-spacing="-1.5">Stream Deck</text>
    <text x="0" y="208" font-size="20" opacity="0.78">.streamDeckPlugin → .cubelist 자동 변환</text>
  </g>

  <g transform="translate(80, 560)" fill="#fff" opacity="0.65" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" font-size="16" letter-spacing="2">rebirthstation.com/marketplace/cubelist/convert</text>
  </g>
