<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A237E"/><stop offset="1" stop-color="#0D1340"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- stat cards (right) -->
