       <text x="260" y="76" fill="#fff" font-size="32" font-weight="800">—</text>
    </g>
    <g><rect x="0"   y="120" width="220" height="100" rx="12" fill="#fff" opacity="0.10"/>
       <text x="20" y="158" fill="#fff" font-size="12" opacity="0.7" letter-spacing="2">INSTALLED PACKS</text>
       <text x="20" y="196" fill="#fff" font-size="32" font-weight="800">—</text>
