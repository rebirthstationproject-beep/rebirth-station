<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A237E"/><stop offset="1" stop-color="#0D1340"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 5 step dots (right) -->
  <g transform="translate(680, 260)" font-family="'Pretendard',sans-serif">
    <g><circle cx="0" cy="0" r="32" fill="#E91E63"/><text x="0" y="6" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text></g>
    <line x1="32" y1="0" x2="78" y2="0" stroke="#E91E63" stroke-width="3"/>
    <g><circle cx="110" cy="0" r="32" fill="#E91E63"/><text x="110" y="6" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text></g>
    <line x1="142" y1="0" x2="188" y2="0" stroke="#E91E63" stroke-width="3"/>
    <g><circle cx="220" cy="0" r="32" fill="#fff"/><text x="220" y="6" text-anchor="middle" fill="#1A237E" font-size="20" font-weight="700">3</text></g>
    <line x1="252" y1="0" x2="298" y2="0" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>
    <g><circle cx="330" cy="0" r="32" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/><text x="330" y="6" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" opacity="0.5">4</text></g>
    <line x1="362" y1="0" x2="408" y2="0" stroke="#fff" stroke-opacity="0.3" stroke-width="3"/>
    <g><circle cx="440" cy="0" r="32" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/><text x="440" y="6" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" opacity="0.5">5</text></g>

    <!-- labels -->
    <text x="0"   y="70" text-anchor="middle" fill="#fff" font-size="12" opacity="0.9">디바이스</text>
    <text x="110" y="70" text-anchor="middle" fill="#fff" font-size="12" opacity="0.9">Google</text>
    <text x="220" y="70" text-anchor="middle" fill="#fff" font-size="12" opacity="0.9">PC 앱</text>
    <text x="330" y="70" text-anchor="middle" fill="#fff" font-size="12" opacity="0.5">페어링</text>
    <text x="440" y="70" text-anchor="middle" fill="#fff" font-size="12" opacity="0.5">첫 큐브</text>
  </g>

  <g transform="translate(80, 200)" fill="#fff" font-family="'Pretendard',sans-serif">
    <text x="0" y="0" font-size="18" font-weight="500" letter-spacing="4" opacity="0.7">ONBOARDING</text>
    <text x="0" y="76" font-size="60" font-weight="800" letter-spacing="-1.5">5분 안에</text>
    <text x="0" y="142" font-size="60" font-weight="800" letter-spacing="-1.5">첫 큐브까지</text>
    <text x="0" y="208" font-size="20" opacity="0.78">디바이스 · Google 계정 · PC 앱 · 페어링 · 큐브</text>
  </g>

  <g transform="translate(80, 560)" fill="#fff" opacity="0.65" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" font-size="16" letter-spacing="2">rebirthstation.com/onboarding</text>
