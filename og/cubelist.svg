<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A237E"/>
      <stop offset="1" stop-color="#0D1340"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 24 cube preview grid (right side, 6x4) -->
  <g transform="translate(620, 100)">
    <g font-family="'Apple Color Emoji','Segoe UI Emoji', sans-serif" font-size="32" text-anchor="middle">
      <!-- row 1 -->
      <g><rect x="0"   y="0" width="78" height="78" rx="12" fill="#FF9800"/><text x="39" y="50" fill="#fff">📈</text></g>
      <g><rect x="90"  y="0" width="78" height="78" rx="12" fill="#9C27B0"/><text x="129" y="50" fill="#fff">🎬</text></g>
      <g><rect x="180" y="0" width="78" height="78" rx="12" fill="#E91E63"/><text x="219" y="50" fill="#fff">🎨</text></g>
      <g><rect x="270" y="0" width="78" height="78" rx="12" fill="#1A237E"/><text x="309" y="50" fill="#fff">💻</text></g>
      <g><rect x="360" y="0" width="78" height="78" rx="12" fill="#10A37F"/><text x="399" y="50" fill="#fff">🤖</text></g>
      <g><rect x="450" y="0" width="78" height="78" rx="12" fill="#03C75A"/><text x="489" y="50" fill="#fff">N</text></g>
      <!-- row 2 -->
      <g><rect x="0"   y="90" width="78" height="78" rx="12" fill="#0064FF"/><text x="39" y="140" fill="#fff">💸</text></g>
      <g><rect x="90"  y="90" width="78" height="78" rx="12" fill="#FFC107"/><text x="129" y="140" fill="#fff">💡</text></g>
      <g><rect x="180" y="90" width="78" height="78" rx="12" fill="#3F51B5"/><text x="219" y="140" fill="#fff">🌧</text></g>
      <g><rect x="270" y="90" width="78" height="78" rx="12" fill="#FF4081"/><text x="309" y="140" fill="#fff">🎵</text></g>
      <g><rect x="360" y="90" width="78" height="78" rx="12" fill="#F1414C"/><text x="399" y="140" fill="#fff">📦</text></g>
      <g><rect x="450" y="90" width="78" height="78" rx="12" fill="#2AC1BC"/><text x="489" y="140" fill="#fff">🛵</text></g>
      <!-- row 3 -->
      <g><rect x="0"   y="180" width="78" height="78" rx="12" fill="#1DB954"/><text x="39" y="230" fill="#fff">⏯</text></g>
      <g><rect x="90"  y="180" width="78" height="78" rx="12" fill="#FF6B35"/><text x="129" y="230" fill="#fff">🟡</text></g>
      <g><rect x="180" y="180" width="78" height="78" rx="12" fill="#D32F2F"/><text x="219" y="230" fill="#fff">🇯🇵</text></g>
      <g><rect x="270" y="180" width="78" height="78" rx="12" fill="#0277BD"/><text x="309" y="230" fill="#fff">🐳</text></g>
      <g><rect x="360" y="180" width="78" height="78" rx="12" fill="#43A047"/><text x="399" y="230" fill="#fff">⏱</text></g>
      <g><rect x="450" y="180" width="78" height="78" rx="12" fill="#5D4037"/><text x="489" y="230" fill="#fff">🧾</text></g>
      <!-- row 4 -->
      <g><rect x="0"   y="270" width="78" height="78" rx="12" fill="#000000"/><text x="39" y="320" fill="#fff">📝</text></g>
      <g><rect x="90"  y="270" width="78" height="78" rx="12" fill="#5865F2"/><text x="129" y="320" fill="#fff">💬</text></g>
      <g><rect x="180" y="270" width="78" height="78" rx="12" fill="#FF0000"/><text x="219" y="320" fill="#fff">▶️</text></g>
      <g><rect x="270" y="270" width="78" height="78" rx="12" fill="#4285F4"/><text x="309" y="320" fill="#fff">✨</text></g>
      <g><rect x="360" y="270" width="78" height="78" rx="12" fill="#D97757"/><text x="399" y="320" fill="#fff">🧡</text></g>
      <g><rect x="450" y="270" width="78" height="78" rx="12" fill="#455A64"/><text x="489" y="320" fill="#fff">🔒</text></g>
    </g>
  </g>

  <!-- brand text (left side) -->
  <g transform="translate(80, 200)" fill="#fff" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <text x="0" y="0" font-size="18" font-weight="500" letter-spacing="4" opacity="0.7">CUBE LIST MARKET</text>
    <text x="0" y="76" font-size="58" font-weight="800" letter-spacing="-1.5">큐브 · 큐브 리스트</text>
    <text x="0" y="142" font-size="58" font-weight="800" letter-spacing="-1.5">큐브 팩</text>
    <text x="0" y="200" font-size="20" font-weight="400" opacity="0.78">
      60+ 시드 카탈로그 · 직군별 큐레이션
    </text>
  </g>

  <g transform="translate(80, 560)" fill="#fff" opacity="0.65" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" font-size="16" letter-spacing="2">rebirthstation.com/marketplace/cubelist</text>
  </g>
</svg>
