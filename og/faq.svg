<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A237E"/>
      <stop offset="1" stop-color="#0D1340"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Q&A stack (right) -->
  <g transform="translate(660, 120)" font-family="'Pretendard',sans-serif">
    <g><rect x="0" y="0" width="460" height="78" rx="10" fill="#fff" opacity="0.10"/>
       <text x="22" y="34" fill="#E91E63" font-size="22" font-weight="700">Q.</text>
       <text x="54" y="34" fill="#fff" font-size="16" font-weight="600">리버스 스테이션은 무엇인가요?</text>
       <text x="22" y="64" fill="#fff" font-size="13" opacity="0.7">A. 잠들어 있는 디바이스에 새로운 가치를 더하는...</text>
    </g>
    <g><rect x="0" y="90" width="460" height="78" rx="10" fill="#fff" opacity="0.10"/>
       <text x="22" y="124" fill="#E91E63" font-size="22" font-weight="700">Q.</text>
       <text x="54" y="124" fill="#fff" font-size="16" font-weight="600">Stream Deck처럼 쓸 수 있나요?</text>
       <text x="22" y="154" fill="#fff" font-size="13" opacity="0.7">A. 하드웨어 추가 비용 없이 가능합니다.</text>
    </g>
    <g><rect x="0" y="180" width="460" height="78" rx="10" fill="#fff" opacity="0.10"/>
       <text x="22" y="214" fill="#E91E63" font-size="22" font-weight="700">Q.</text>
       <text x="54" y="214" fill="#fff" font-size="16" font-weight="600">마켓플레이스 큐브팩은 안전한가요?</text>
       <text x="22" y="244" fill="#fff" font-size="13" opacity="0.7">A. 큐레이션 4중 검증 + Tier 권한 모델.</text>
    </g>
    <g><rect x="0" y="270" width="460" height="78" rx="10" fill="#fff" opacity="0.10"/>
       <text x="22" y="304" fill="#E91E63" font-size="22" font-weight="700">Q.</text>
       <text x="54" y="304" fill="#fff" font-size="16" font-weight="600">한국 외 지역에서도 쓸 수 있나요?</text>
       <text x="22" y="334" fill="#fff" font-size="13" opacity="0.7">A. 다국어 지원 + 글로벌 큐브팩 단계적.</text>
    </g>
    <g><rect x="0" y="360" width="460" height="78" rx="10" fill="url(#bg)" stroke="#E91E63" stroke-width="2"/>
       <text x="22" y="394" fill="#E91E63" font-size="22" font-weight="700">Q.</text>
       <text x="54" y="394" fill="#fff" font-size="16" font-weight="600">큐브팩 판매할 수 있나요?</text>
       <text x="22" y="424" fill="#fff" font-size="13" opacity="0.7">A. Stage 4 결제 활성 후 셀러 등급제.</text>
    </g>
  </g>

  <!-- brand text -->
  <g transform="translate(80, 200)" fill="#fff" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <text x="0" y="0" font-size="18" font-weight="500" letter-spacing="4" opacity="0.7">FAQ · SUPPORT</text>
    <text x="0" y="76" font-size="62" font-weight="800" letter-spacing="-1.5">자주 묻는</text>
    <text x="0" y="142" font-size="62" font-weight="800" letter-spacing="-1.5">질문</text>
    <text x="0" y="208" font-size="20" font-weight="400" opacity="0.78">고객센터 · 큐브 리스트·Rebirth Station 답변</text>
  </g>

  <g transform="translate(80, 560)" fill="#fff" opacity="0.65" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" font-size="16" letter-spacing="2">rebirthstation.com/faq</text>
  </g>
</svg>
