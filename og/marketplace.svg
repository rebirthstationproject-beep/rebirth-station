  <!-- brand text -->
  <g transform="translate(80, 200)" fill="#fff" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
    <text x="0" y="0" font-size="18" font-weight="500" letter-spacing="4" opacity="0.7">MARKETPLACE</text>
    <text x="0" y="76" font-size="60" font-weight="800" letter-spacing="-1.5">직군별 큐브팩</text>
    <text x="0" y="142" font-size="60" font-weight="800" letter-spacing="-1.5">한 번의 클릭</text>
    <text x="0" y="208" font-size="20" font-weight="400" opacity="0.78">검증된 크리에이터 큐브팩 · 60+ 시드 카탈로그</text>
  </g>

  <g transform="translate(80, 560)" fill="#fff" opacity="0.65" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" font-size="16" letter-spacing="2">rebirthstation.com/marketplace</text>
  </g>
