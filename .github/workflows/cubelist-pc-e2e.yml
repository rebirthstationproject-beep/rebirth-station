name: Cube List PC — E2E Tests

# v0.1.3+ Playwright smoke 테스트 자동화.
# 트리거: PR + main 푸시 (program/cubelist/apps/pc-version 변경 감지)

on:
  push:
    branches: [main]
    paths:
      - 'program/cubelist/apps/pc-version/**'
      - '.github/workflows/cubelist-pc-e2e.yml'
  pull_request:
    paths:
      - 'program/cubelist/apps/pc-version/**'
      - '.github/workflows/cubelist-pc-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright Smoke (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            program/cubelist/apps/pc-version/frontend/package-lock.json
            program/cubelist/apps/pc-version/e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: program/cubelist/apps/pc-version/frontend
        run: npm ci

      - name: Build frontend
        working-directory: program/cubelist/apps/pc-version/frontend
        run: npm run build

      - name: Install E2E dependencies
        working-directory: program/cubelist/apps/pc-version/e2e
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('program/cubelist/apps/pc-version/e2e/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: program/cubelist/apps/pc-version/e2e
        run: npx playwright install --with-deps chromium

      - name: Install only OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: program/cubelist/apps/pc-version/e2e
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        working-directory: program/cubelist/apps/pc-version/e2e
        env:
          CI: 'true'
        run: npm test

      - name: Upload HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: program/cubelist/apps/pc-version/e2e/playwright-report
          retention-days: 14

      - name: Upload trace + screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: program/cubelist/apps/pc-version/e2e/test-results
          retention-days: 14
